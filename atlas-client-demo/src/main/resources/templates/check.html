<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('정합성 점검')}"></head>
<body>
<header th:replace="~{fragments :: nav('check')}"></header>
<div class="layout">
<main>
    <h1>정합성 점검</h1>
    <p class="lead"><code>atlas check</code>와 같은 <code>ConsistencyChecker</code>: inputs/outputs가 없는 process, 삭제된 엔티티를 가리키는 edge,
        qualifiedName 중복을 찾습니다. 검색 인덱스를 쓰므로 방금 만든 엔티티는 잠시 뒤에 잡힐 수 있습니다.</p>
    <div th:replace="~{fragments :: alerts}"></div>
    <form class="panel form-row" method="get" th:action="@{/check}">
        <label>process 타입 (하위 타입 포함)<input type="text" name="processType" th:value="${processType}"></label>
        <label style="flex: 1">중복 검사할 타입 (쉼표 구분)<input type="text" name="duplicates" th:value="${duplicates}" placeholder="console_demo_table"></label>
        <button>점검</button>
    </form>
    <section class="panel" th:if="${findings}">
        <h2>결과 <span class="badge" th:classappend="${#lists.isEmpty(findings)} ? 'ok' : 'err'"
                     th:text="${#lists.isEmpty(findings)} ? '문제 없음' : ${#lists.size(findings)} + '건'"></span></h2>
        <table th:unless="${#lists.isEmpty(findings)}">
            <thead><tr><th>종류</th><th>타입</th><th>qualifiedName</th><th>내용</th></tr></thead>
            <tbody><tr th:each="f : ${findings}">
                <td><span class="badge err" th:text="${f.kind()}"></span></td>
                <td th:text="${f.typeName()}"></td>
                <td><a th:href="@{/entities/{g}(g=${f.guid()})}" th:text="${f.qualifiedName()}"></a></td>
                <td th:text="${f.message()}"></td>
            </tr></tbody>
        </table>
    </section>
    <section th:replace="~{fragments :: trace}"></section>
</main>
<aside class="help" th:replace="~{help/check :: help}"></aside>
</div>
</body>
</html>
