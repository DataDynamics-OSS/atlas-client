<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head(${def.name})}"></head>
<body>
<header th:replace="~{fragments :: nav('types')}"></header>
<div class="layout">
<main>
    <h1 th:text="${def.name}"></h1>
    <p class="lead">
        <span class="badge" th:text="${def.category}"></span>
        <span th:text="${def.description}"></span>
    </p>
    <p>
        <a class="button secondary" th:href="@{/types/plan(from=${def.name})}">이 정의로 plan 하기</a>
        <a class="button secondary" th:href="@{/types/delete(names=${def.name})}">삭제 점검</a>
        <a class="button secondary" th:href="@{/types/export(names=${def.name})}">YAML 다운로드</a>
        <a class="button secondary" th:if="${def.category.name() == 'ENTITY'}"
           th:href="@{/entities(search=1,typeName=${def.name})}">엔티티 검색</a>
    </p>
    <section class="panel">
        <div class="tabs" data-tabs>
            <button type="button" data-tab="yaml">export YAML (서버 필드 제거)</button>
            <button type="button" data-tab="json">서버 응답 JSON</button>
        </div>
        <div id="yaml" class="tab-panel"><pre class="code" data-lang="yaml" data-max-height="640" th:text="${yaml}"></pre></div>
        <div id="json" class="tab-panel"><pre class="code" data-lang="json" data-max-height="640" th:text="${json}"></pre></div>
    </section>
    <section th:replace="~{fragments :: trace}"></section>
</main>
<aside class="help" th:replace="~{help/types-detail :: help}"></aside>
</div>
</body>
</html>
