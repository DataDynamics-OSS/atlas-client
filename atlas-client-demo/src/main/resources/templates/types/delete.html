<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('타입 삭제')}"></head>
<body>
<header th:replace="~{fragments :: nav('types')}"></header>
<div class="layout">
<main>
    <h1>타입 삭제</h1>
    <p class="lead"><code>planDelete()</code>는 하위 타입, 참조, 남은 인스턴스(soft-deleted 포함), classification이 붙은 엔티티를 미리 검사합니다.</p>
    <div th:replace="~{fragments :: alerts}"></div>
    <form class="panel form-row" method="get" th:action="@{/types/delete}">
        <label style="flex: 1">타입 이름 (쉼표나 공백으로 구분)<input type="text" name="names" th:value="${names}"></label>
        <button>점검</button>
    </form>
    <section class="panel" th:if="${plan}">
        <h2>점검 결과 <span class="muted small" th:text="${plan.summary()}"></span></h2>
        <div th:each="c : ${plan.changes}" th:class="'plan-' + ${c.action().label()}"
             th:text="${c.action().symbol()} + ' ' + ${c.action().label()} + ' ' + ${c.category()} + ' ' + ${c.name()}"></div>
        <div th:each="i : ${plan.issues}" style="margin-top: 6px">
            <span class="badge" th:classappend="${i.isError()} ? 'err' : 'warn'" th:text="${i.severity()}"></span>
            <strong th:text="${i.typeName()}"></strong> <span th:text="${i.message()}"></span>
        </div>
        <form method="post" th:action="@{/types/delete}" th:unless="${plan.hasErrors()}" style="margin-top: 12px"
              data-confirm="정말 삭제할까요?">
            <input type="hidden" name="names" th:value="${names}">
            <button class="danger">삭제</button>
        </form>
    </section>
    <section class="panel" th:if="${result}">
        <h2>삭제 결과</h2>
        <dl class="kv"><dt>deleted</dt><dd th:text="${result.deleted()}"></dd></dl>
    </section>
    <section th:replace="~{fragments :: trace}"></section>
</main>
<aside class="help" th:replace="~{help/types-delete :: help}"></aside>
</div>
</body>
</html>
